<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daymaster" />
  <title>Daymaster</title>
  <link rel="manifest" href="/daymaster/manifest.json" />
  <link rel="apple-touch-icon" href="/daymaster/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f0f'/%3E%3Crect x='8' y='8' width='48' height='48' rx='10' fill='%231a1a1a' stroke='%23c8a96e' stroke-width='2'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='28' font-weight='bold' fill='%23c8a96e'%3ED%3C/text%3E%3Ccircle cx='48' cy='16' r='6' fill='%23c8a96e'/%3E%3C/svg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #e8e4dc; font-family: monospace; }
    #root { min-height: 100vh; }
    #splash {
      position: fixed; inset: 0; background: #0f0f0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: monospace; color: #555; z-index: 9999;
      transition: opacity 0.4s;
    }
    #splash .brand { font-size: 28px; font-weight: 900; letter-spacing: -1px; color: #e8e4dc; }
    #splash .brand span { color: #c8a96e; }
    #splash .sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="brand">Day<span>master</span></div>
    <div class="sub">Loading...</div>
  </div>
  <div id="root"></div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Config -->
  <script>
    window.DAYMASTER_CONFIG = {
      GOOGLE_CLIENT_ID: "784784668482-2dkhosclvu1rak6h6orsr96bcfdbog12.apps.googleusercontent.com",
      APP_URL: "bigskybob",
      DRIVE_FOLDER: "Daymaster",
    };
    window.__daymasterReady = function() {
      const splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(()=>splash.remove(), 400); }
    };
  </script>

  <!-- Bundled app (Vite) — replaces the CDN React + in-browser Babel of the legacy index.html -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
