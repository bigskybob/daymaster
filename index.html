<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Daymaster" />
  <title>Daymaster</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #e8e4dc; font-family: monospace; }
    #root { min-height: 100vh; }
    #splash {
      position: fixed; inset: 0; background: #0f0f0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: monospace; color: #555; z-index: 9999;
      transition: opacity 0.4s;
    }
    #splash .brand {
      font-size: 28px; font-weight: 900; letter-spacing: -1px; color: #e8e4dc;
    }
    #splash .brand span { color: #c8a96e; }
    #splash .sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="brand">Day<span>master</span></div>
    <div class="sub">Loading...</div>
  </div>
  <div id="root"></div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- React + Babel (no build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Config: replace these values after Google Cloud setup -->
  <script>
    window.DAYMASTER_CONFIG = {
      // Step 1: Replace with your Google OAuth Client ID
      // Get this from console.cloud.google.com
      GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID_HERE",

      // Step 2: Replace with your GitHub Pages URL once deployed
      // Format: https://YOURUSERNAME.github.io/daymaster
      APP_URL: "YOUR_GITHUB_PAGES_URL_HERE",

      // Drive folder name — change if you want
      DRIVE_FOLDER: "Daymaster",
    };
  </script>

  <!-- App -->
  <script type="text/babel" src="app.js" data-presets="react"></script>

  <script>
    // Hide splash once React mounts
    window.__daymasterReady = function() {
      const splash = document.getElementById('splash');
      if (splash) { splash.style.opacity = '0'; setTimeout(()=>splash.remove(), 400); }
    };
  </script>
</body>
</html>
