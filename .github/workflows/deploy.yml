name: Deploy to GitHub Pages

# Active deploy (post-cutover, 2026-06-04). Builds the Vite app and publishes it
# to GitHub Pages on every push to main, plus a manual trigger. Requires repo
# Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Vite entry is app.build.html so it never clobbers the legacy root
      # index.html. Pages wants index.html, so rename in the artifact.
      - run: mv docs/app.build.html docs/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
