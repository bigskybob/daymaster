PROJECTS_DB_ID = "626e8335-b6bd-480a-b025-8d425f08f08a"

# #112 — the 💡 capture button posts here, into ClipJob's Slack door. The channel
# is ClipJob's SLACK_INBOX_CHANNEL (#cj-inbox), so captures join the generic tray
# and Claude triage picks the destination. Set the id, not the name.
#   SLACK_CAPTURE_CHANNEL = "C0XXXXXXXXX"
#
# The token is a SECRET and must be a Slack USER token (xoxp-, chat:write scope) —
# ClipJob's door ignores messages carrying a bot_id, so a bot token posts happily
# and is then silently dropped. Set it with:
#   wrangler secret put SLACK_USER_TOKEN
